# Conda environment for reproducing the NeurIPS BCI EEG BCI decoder from data download to evaluation.
# Recommended setup (handles the PyTorch CUDA 13.0 wheel channel + PyPI stack cleanly):
#   bash scripts/setup_conda_env.sh
#
# Standard Conda creation:
#   conda env create -f environment.yml
#   conda activate neurips-bci
#   pip install -e .
name: neurips-bci
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip>=24.0
  - uv>=0.4
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.14.1
      - torchvision==0.29.1
      - torchaudio==2.11.0
      - numpy==2.5.4
      - scipy==1.18.1
      - scikit-learn==1.9.1
      - pandas==3.1.0
      - mne==1.13.2
      - mne-bids==0.20.0
      - moabb==1.7.2
      - pyriemann==0.12
      - braindecode==1.8.1
      - benchopt==1.10.0
      - neuralset==0.4.0
      - neuralfetch==0.4.0
      - neuraltrain==0.4.0
      - neuralbench==0.4.0
      - exca==0.5.29
      - nemar-py==0.3.3
      - huggingface_hub==2.3.0
      - safetensors==0.8.0
      - transformers==5.20.2
      - peft==0.21.2
      - einops==0.8.2
      - pybv==0.8.1
      - edfio==0.4.18
      - h5py==3.16.0
      - pyarrow==26.0.0
      - PyYAML==6.0.3
      - joblib==1.6.0
      - tqdm==4.70.1
      - requests==2.34.2
      - matplotlib==3.11.2
      - pytest==9.1.1
      - -e .
